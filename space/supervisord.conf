; Process tree of the demo image. start.sh exports RUN, PGDATA and the credentials before
; exec'ing supervisord; every program inherits them. Stores start at once; bootstrap.sh
; starts the rest (autostart=false) once the stores answer.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=%(ENV_RUN)s/supervisord.pid
childlogdir=%(ENV_RUN)s

[unix_http_server]
file=%(ENV_RUN)s/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_RUN)s/supervisor.sock

; ---- stores: bound to 127.0.0.1, never published -----------------------------------------

; dynamic_shared_memory_type=mmap: a container's /dev/shm is 64 MB and cannot be raised on
; a Space; docker-compose.yml raises shm_size for the same reason.
[program:postgres]
command=postgres -D %(ENV_PGDATA)s -c listen_addresses=127.0.0.1 -c unix_socket_directories=%(ENV_RUN)s -c dynamic_shared_memory_type=mmap -c shared_buffers=256MB
priority=10
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server %(ENV_RUN)s/redis/redis.conf
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
command=minio server --quiet --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 %(ENV_RUN)s/minio
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---- one-shot setup ---------------------------------------------------------------------

[program:bootstrap]
command=bash /app/space/bootstrap.sh
priority=20
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---- application (started by bootstrap.sh) ---------------------------------------------

[program:api]
command=uvicorn variant_etl.api.app:app --host 127.0.0.1 --port 8000 --no-access-log
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Two single-process workers, as two containers would be in docker-compose.yml.
[program:worker1]
command=celery -A variant_etl.pipeline.celery_app:app worker --queues=variant_etl --concurrency=1 --loglevel=INFO --hostname=worker1@%%h
autostart=false
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker2]
command=celery -A variant_etl.pipeline.celery_app:app worker --queues=variant_etl --concurrency=1 --loglevel=INFO --hostname=worker2@%%h
autostart=false
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Deletes jobs and files older than DEMO_RETENTION_MINUTES, keeping the sample.
[program:janitor]
command=python -m variant_etl.janitor
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The only public port.
[program:nginx]
command=nginx -c %(ENV_RUN)s/nginx/nginx.conf -g "daemon off;"
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# The demo's only public port (7860). Everything goes to the API, except PUT requests under
# the bucket's path: those are the browser's presigned uploads and go straight to MinIO, so
# the upload path is the same as with docker-compose (the API never handles file bytes).
# start.sh fills in __RUN__ and __SIGNED_HOST__.

worker_processes 1;
pid __RUN__/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path __RUN__/nginx/client_body;
    proxy_temp_path __RUN__/nginx/proxy;
    fastcgi_temp_path __RUN__/nginx/fastcgi;
    uwsgi_temp_path __RUN__/nginx/uwsgi;
    scgi_temp_path __RUN__/nginx/scgi;

    # API requests are small JSON bodies.
    client_max_body_size 1m;

    server {
        listen 7860;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Presigned uploads (S3_BUCKET=variant-etl, path-style URLs). Only PUT: the browser
        # never reads from storage, and MinIO checks every request's signature anyway.
        location /variant-etl/ {
            limit_except PUT {
                deny all;
            }
            client_max_body_size 20m; # the demo's upload cap; larger files get 413
            proxy_request_buffering off;
            proxy_http_version 1.1;
            # The URL was signed for the public host and the signature covers the Host
            # header, so MinIO is shown that host whatever the edge proxy in front sends.
            proxy_set_header Host __SIGNED_HOST__;
            proxy_pass http://127.0.0.1:9000;
        }
    }
}

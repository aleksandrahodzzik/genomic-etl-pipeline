name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # The oracle test compares our normalizer with `bcftools norm`; with bcftools on PATH
      # it runs natively and cannot be skipped.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bcftools
      - run: bcftools --version | head -n 1
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -ra

  integration:
    needs: unit
    runs-on: ubuntu-latest
    env:
      REQUIRE_INTEGRATION: "1" # an unreachable stack fails the build instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Integration tests
        run: uv run pytest tests/integration -ra
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docker-build:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: variant-etl:ci

name: variant-etl

x-app: &app
  build: .
  image: variant-etl:local
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://variants:variants@postgres:5432/variants
    REDIS_URL: redis://redis:6379/0
    # In-network address used by the API and workers...
    S3_ENDPOINT_URL: http://minio:9000
    # ...and the address a client outside Docker can reach, used to sign presigned URLs.
    S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    S3_BUCKET: variant-etl
    CHUNK_SIZE: "100000"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: variants
      POSTGRES_PASSWORD: variants
      POSTGRES_DB: variants
    # Host ports can be moved if another project already uses them: POSTGRES_PORT=5433 make up
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    # Docker gives containers a 64 MB /dev/shm; parallel queries and VACUUM on a
    # million-row table need more dynamic shared memory than that and fail with DiskFull.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U variants -d variants"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. MinIO's community edition stopped publishing images, so
  # this pins the newest tag of the pgsty/minio fork. The application only speaks the S3
  # API, so swapping this service (or pointing S3_ENDPOINT_URL at AWS S3) needs no code change.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  bucket-init:
    <<: *app
    command: ["python", "-m", "variant_etl.storage.init_bucket"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      minio: { condition: service_healthy }

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      bucket-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # No container_name and no published ports, so it scales:
  #   docker compose up -d --scale worker=4
  # Each replica is an independent container consuming chunk tasks from the same queue.
  worker:
    <<: *app
    command:
      - celery
      - -A
      - variant_etl.pipeline.celery_app:app
      - worker
      - --queues=variant_etl
      - --concurrency=1
      - --loglevel=INFO
    healthcheck:
      test: ["CMD-SHELL", "celery -A variant_etl.pipeline.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      bucket-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
